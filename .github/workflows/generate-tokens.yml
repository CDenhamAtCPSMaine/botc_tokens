name: 'Build My Custom Tokens'

on:
  # Allows manual execution from the Actions tab
  workflow_dispatch:

  # Automatically runs when you push changes to key files
  push:
    branches:
      - 'main'
      - 'stable'
    paths:
      # Key files the workflow depends on
      - 'my_script.json'
      - 'my_reminders.json'
      - 'my_component_packs/**'
      - '.github/workflows/generate-tokens.yml'

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Set up Python 3.10'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Install ImageMagick (CRITICAL for Wand/image manipulation)
      - name: 'Install ImageMagick'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # 2. PATCH THE WIKI LINK (Fixes the persistent HTTP 404 Error by pointing to the assets repo)
      # This replaces the old Tsubashi/botc_tokens link with the correct Tsubashi/botc_assets link.
      - name: 'Patch Wiki Soup File Path'
        run: |
          sed -i 's|Tsubashi/botc_assets/main/roles.json|Tsubashi/botc_assets/main/data/roles.json|g' src/botc_tokens/helpers/wiki_soup.py

      # 3. Install the botc_tokens tool (must run AFTER the patch)
      - name: 'Install Python Dependencies'
        run: |
          pip install .

      # 4. Run 'botc_tokens update' to get core data, using YOUR reminders file
      - name: 'Run: botc_tokens update'
        run: |
          botc_tokens update \
            --output-dir ./inputs \
            --reminders ./my_reminders.json

      # 5. Run 'botc_tokens create' to generate tokens, using YOUR component packs
      - name: 'Run: botc_tokens create'
        run: |
          botc_tokens create ./inputs \
            --output-dir ./tokens \
            --components ./my_component_packs

      # 6. Run 'botc_tokens group' to arrange tokens into printable sheets, using YOUR script
      - name: 'Run: botc_tokens group'
        run: |
          botc_tokens group ./my_script.json \
            --token-dir ./tokens \
            --output-dir ./printables

      # 7. Upload the final 'printables' folder as an artifact
      - name: 'Upload Printable Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: 'printable-tokens'
          path: ./printables/